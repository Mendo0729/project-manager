services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: project-manager-app-dev
    restart: unless-stopped
    working_dir: /workspace
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-project_manager}:${POSTGRES_PASSWORD:-project_manager}@db:5432/${POSTGRES_DB:-project_manager}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/workspace
      - project_manager_node_modules:/workspace/node_modules
      - project_manager_web_node_modules:/workspace/apps/web/node_modules
      - project_manager_api_node_modules:/workspace/apps/api/node_modules
      - project_manager_pnpm_store:/pnpm/store
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: project-manager-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_manager}
      POSTGRES_USER: ${POSTGRES_USER:-project_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_manager}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project_manager_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_manager} -d ${POSTGRES_DB:-project_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  project_manager_db_dev:
  project_manager_node_modules:
  project_manager_web_node_modules:
  project_manager_api_node_modules:
  project_manager_pnpm_store:
